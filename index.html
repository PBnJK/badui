<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link href="style.css" rel="stylesheet" />

    <script src="js/collision.js"></script>
    <script src="js/ball.js"></script>
    <script src="js/hole.js"></script>
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <header id="header">
      <h1 id="header-title">Phone Number Plinko!</h1>
    </header>

    <main id="wrapper">
      <div id="input-wrapper">
        <label for="input-telephone" id="label-telephone">
          <b>Your telephone number:</b>
        </label>
        <input
          readonly
          id="input-telephone"
          type="tel"
          name="input-telephone"
        />
      </div>
      <div id="plinko-wrapepr">
        <canvas id="canvas" width="640" height="400"></canvas>
        <div id="controls-wrapper">
          <button id="btn-release"><b>Release ball!</b></button>
          <button id="btn-reroll">🔄</button>
        </div>
      </div>
    </main>
  </body>
</html>
